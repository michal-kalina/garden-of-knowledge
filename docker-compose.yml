services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gok_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gok}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gok}"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gok}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gok_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      target: api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gok}:${POSTGRES_PASSWORD:-gok_dev_password}@postgres:5432/${POSTGRES_DB:-gok}?sslmode=disable
      HTTP_ADDR: ":8080"
      PARSER_URL: http://parser:8000
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-gok}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gok_dev_password}
      S3_BUCKET: documents
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gok}:${POSTGRES_PASSWORD:-gok_dev_password}@postgres:5432/${POSTGRES_DB:-gok}?sslmode=disable
      PARSER_URL: http://parser:8000
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-gok}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gok_dev_password}
      S3_BUCKET: documents
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      parser:
        condition: service_started

  parser:
    build:
      context: ./parser
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
